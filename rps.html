<nav>

</nav>
<button onclick="p('rock')">Rock</button>
<button onclick="p('paper')">Paper</button>
<button onclick="p('scissors')">Scissors</button>
<p id="r"></p>

<script>
function p(c){
  let a=['rock','paper','scissors'],
      d=a[Math.floor(Math.random()*3)];
  r.innerText = c==d ? 'Tie' :
    (c=='rock'&&d=='scissors'||c=='paper'&&d=='rock'||c=='scissors'&&d=='paper')
    ? 'Win' : 'Lose';
}
</script>
