<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS - Sammy's Games</title>
  <style>
    /* Global Styles (Matches Home Page) */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #121212; 
      color: white; 
      text-align: center; 
      margin: 0;
      padding: 0;
    }

    /* Navigation Bar */
    nav {
      background-color: #1e1e1e;
      padding: 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #007bff;
    }

    h1 {
      margin-top: 40px;
      font-size: 2.5rem;
      color: #007bff;
    }

    /* Game Container Card */
    .game-container {
      background-color: #1e1e1e;
      border-radius: 15px;
      padding: 40px;
      max-width: 600px;
      margin: 40px auto;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Button Styling */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }

    button {
      background-color: #2a2a2a;
      color: white;
      border: 2px solid #444;
      padding: 15px 25px;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    button:hover {
      background-color: #333;
      border-color: #007bff;
      transform: translateY(-3px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Result and Score Text */
    #result {
      font-size: 1.2rem;
      height: 1.5em; /* Prevents layout jump when text appears */
      margin: 20px 0;
      color: #00d4ff;
    }

    .score-board {
      background: #121212;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 200px;
      border: 1px solid #333;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="rps.html">RPS</a>
    <a href="knockout.html">Knockout</a>
    <a href="knockout_bot.html">Knockout Bot</a>
    <a href="five_hands.html">Five Hands</a>
    <a href="six_hands.html">Six Hands</a>
    <a href="step_count.html">Step Count</a>
    <a href="spiral_puzzle.html">Color Spiral</a>
  </nav>

  <h1>Rock Paper Scissors</h1>

  <div class="game-container">
    <p>Make your move:</p>
    
    <div class="button-group">
      <button onclick="play('rock')">🪨 Rock</button>
      <button onclick="play('paper')">📄 Paper</button>
      <button onclick="play('scissors')">✂️ Scissors</button>
    </div>

    <p id="result">Choose an option to start!</p>
    
    <div class="score-board">
      <span id="score">Wins: 0 | Losses: 0 | Ties: 0</span>
    </div>
  </div>

  <script>
    let wins = 0;
    let losses = 0;
    let ties = 0;

    function play(playerChoice) {
      const options = ['rock', 'paper', 'scissors'];
      const computerChoice = options[Math.floor(Math.random() * 3)];
      let outcome = '';

      if (playerChoice === computerChoice) {
        outcome = "It's a Tie!";
        ties++;
      } else if (
        (playerChoice === 'rock' && computerChoice === 'scissors') ||
        (playerChoice === 'paper' && computerChoice === 'rock') ||
        (playerChoice === 'scissors' && computerChoice === 'paper')
      ) {
        outcome = "You Win!";
        wins++;
      } else {
        outcome = "You Lose!";
        losses++;
      }

      // Update UI with better formatting
      const resultEl = document.getElementById('result');
      resultEl.innerHTML = `You chose <strong>${playerChoice}</strong>, computer chose <strong>${computerChoice}</strong>.<br>${outcome}`;
      
      document.getElementById('score').innerText = `Wins: ${wins} | Losses: ${losses} | Ties: ${ties}`;
    }
  </script>

</body>
</html>
