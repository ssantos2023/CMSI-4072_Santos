<!DOCTYPE html>
<html>
<head>
  <title>Sammy's Games</title>
</head>
<body>
<h1>RPS</h1>

<nav>
  <a href="index.html">Home</a> |
  <a href="rps.html">RPS</a> |
  <a href="knockout.html">Knockout</a> |
  <a href="knockout_bot.html">Knockout Bot</a> |
  <a href="five_hands.html">Five Hands</a> |
  <a href="six_hands.html">Six Hands</a>
</nav>

<button onclick="play('rock')">Rock</button>
<button onclick="play('paper')">Paper</button>
<button onclick="play('scissors')">Scissors</button>

<p id="result"></p>
<p id="score">Wins: 0 | Losses: 0 | Ties: 0</p>

<script>
let wins = 0;
let losses = 0;
let ties = 0;

function play(playerChoice){
  const options = ['rock', 'paper', 'scissors'];
  const computerChoice = options[Math.floor(Math.random() * 3)];
  let outcome = '';

  if(playerChoice === computerChoice){
    outcome = 'Tie';
    ties++;
  } else if(
    (playerChoice === 'rock' && computerChoice === 'scissors') ||
    (playerChoice === 'paper' && computerChoice === 'rock') ||
    (playerChoice === 'scissors' && computerChoice === 'paper')
  ) {
    outcome = 'Win';
    wins++;
  } else {
    outcome = 'Lose';
    losses++;
  }

  document.getElementById('result').innerText = `You chose ${playerChoice}, computer chose ${computerChoice}. ${outcome}!`;
  document.getElementById('score').innerText = `Wins: ${wins} | Losses: ${losses} | Ties: ${ties}`;
}
</script>
</body>
</html>
