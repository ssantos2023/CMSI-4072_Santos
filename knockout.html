<html>
<head>
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(4, 80px);
      gap: 5px;
      width: max-content;
      margin: 50px auto;
    }

    .cell {
      background: lightgray;
      border: 1px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <div class="board" id="board"></div>

    <script>
    for(let i = 0; i < 16; i++){
      let cell = document.createElement("div");
      cell.className = "cell";
      board.appendChild(cell);
      cell.onclick = () => {
      cell.textContent = "X";
      };
    }
    </script>
    

</body>
</html>
