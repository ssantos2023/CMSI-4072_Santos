<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sammy's Games</title>
  <header class="topbar">
    <h1>Step Count</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="rps.html">RPS</a> |
      <a href="knockout.html">Knockout</a> |
      <a href="knockout_bot.html">Knockout Bot</a> |
      <a href="five_hands.html">Five Hands</a> |
      <a href="six_hands.html">Six Hands</a> |
      <a href="step_count.html">Step Count</a> |
      <a href="spiral_puzzle.html">Color Spiral</a>
  
  </nav>
  </header>
  <style>
    body {
      font-family: monospace;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }

    .page {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 70px);
      grid-template-rows: repeat(7, 70px);
      gap: 4px;
    }

    .cell {
      background: #2a2a4a;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.12s;
      user-select: none;
      color: #aaa;
    }

    .cell:hover { background: #3a3a5a; }

    .cell.selected  { background: #c8a800 !important; }
    .cell.valid     { background: #1a6a8a !important; cursor: pointer; }
    .cell.path      { background: #3a5a3a !important; }
    .cell.blocked   { background: #111122 !important; color: #333; cursor: default; border-color: #222; }

    .x { color: #f87c56; font-size: 30px; }
    .o { color: #56b4f8; font-size: 30px; }

    #infoPanel {
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #turnIndicator { font-size: 20px; font-weight: bold; }

    .info-block {
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.8;
    }

    .info-block .label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .big-num { font-size: 36px; font-weight: bold; color: #eee; line-height: 1; }

    #announcement {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: crimson;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .topbar {
        width: 100%;
        background: #111;
        padding: 10px 0;
        text-align: center;
        border-bottom: 1px solid #333;
        }

        .topbar h1 {
        margin: 5px 0;
        }

        .topbar nav {
        margin-top: 5px;
        }

        .topbar a {
        color: #ccc;
        text-decoration: none;
        margin: 0 10px;
        }

        .topbar a:hover {
        color: white;
        }
        .container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 100px);
        }
  </style>
</head>
<body>

<div id="announcement"></div>
<div class="container">
<div class="page">
  <div class="board" id="board"></div>

  <div id="infoPanel">
    <div id="turnIndicator">Turn: <span class="x">X</span></div>

    <div class="info-block">
      <div class="label">Steps to take</div>
      <div class="big-num" id="stepsDisplay">1</div>
    </div>

    <div class="info-block">
      <div class="label">X landed on</div>
      <div class="big-num x" id="xLastNum">&#8212;</div>
    </div>

    <div class="info-block">
      <div class="label">O landed on</div>
      <div class="big-num o" id="oLastNum">&#8212;</div>
    </div>

    <div class="info-block" style="font-size:12px; color:#888; line-height:1.6;">
      Click your piece to start. Click adjacent squares to step. Re-click your piece to cancel. Dark squares are blocked.
    </div>
  </div>
</div>
</div>

<script>
const SIZE = 7;
const TOTAL = SIZE * SIZE;
const X_START = 3;
const O_START = TOTAL - 4; // index 45

let boardNumbers  = Array(TOTAL).fill(null);
let boardState    = Array(TOTAL).fill(null);
let blocked       = new Set();

let xturn          = true;
let stepsRemaining = 1; 
let moving         = false;
let currentPath    = [];   
let lastNumX       = "—";
let lastNumO       = "—";
let gameOver       = false;

for (let i = 0; i < TOTAL; i++) {
  if (i !== X_START && i !== O_START) {
    boardNumbers[i] = Math.floor(Math.random() * 4) + 1;
  }
}

boardState[X_START] = "X";
boardState[O_START] = "O";

const boardEl = document.getElementById("board");
for (let i = 0; i < TOTAL; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.index = i;
  cell.onclick = () => handleClick(i);
  boardEl.appendChild(cell);
}

updateBoard();
function canCompletePath(start, steps, visited = new Set()) {
  if (steps === 0) return true;

  visited.add(start);

  for (const adj of getAdjacent(start)) {
    if (
      !visited.has(adj) &&
      !blocked.has(adj) &&
      boardState[adj] === null
    ) {
      if (canCompletePath(adj, steps - 1, new Set(visited))) {
        return true;
      }
    }
  }

  return false;
}

function handleClick(i) {
  if (gameOver) return;

  const piece = xturn ? "X" : "O";

  if (!moving) {
    if (boardState[i] === piece) {
      moving = true;
      currentPath = [i];
      updateBoard();
    }
    return;
  }

  const currentPos = currentPath[currentPath.length - 1];

  // --- Fixed Cancel Logic ---
  if (i === currentPos) {
  if (currentPath.length > 1) {
    const startPos = currentPath[0];

    // Reset piece back to start
    boardState[startPos] = piece;
    boardState[currentPos] = null;
  }

  moving = false;
  currentPath = [];

  // Restore correct step count
  stepsRemaining = xturn
    ? (lastNumO !== "—" ? parseInt(lastNumO) : 1)
    : (lastNumX !== "—" ? parseInt(lastNumX) : 1);

  updateBoard();
  return;
}

  if (!isValidStep(currentPos, i)) return;

  boardState[i] = boardState[currentPos];
  boardState[currentPos] = null;
  currentPath.push(i);
  stepsRemaining--;

  if (stepsRemaining === 0) {
  finishMove(i);
} else {
  const stuckFromHere = !getAdjacent(i).some(adj => isValidStep(i, adj));

  if (stuckFromHere) {
    const startPos = currentPath[0];

    const canMoveFromStart = canCompletePath(startPos, stepsRemaining);

    if (canMoveFromStart) {
      // Allow reset instead of forcing turn end
      announce(`${piece} is stuck! Click your piece to reset.`);
      updateBoard();
      return;
    } else {
      // No moves at all → lose game
      announce(`${piece} has no moves! ${piece === "X" ? "O" : "X"} wins!`);
      gameOver = true;
      updateBoard();
      return;
    }
  } else {
    updateBoard();
  }
}
}

function finishMove(landedOn) {
  // Block the original square the player started from this turn
  if (currentPath.length > 0) {
    blocked.add(currentPath[0]);
  }
  
  // Block the final landing square
  blocked.add(landedOn);

  const num = boardNumbers[landedOn];
  const nextSteps = (num !== null) ? num : 1;

  if (xturn) {
    lastNumX = (num !== null) ? String(num) : "—";
    document.getElementById("xLastNum").textContent = lastNumX;
  } else {
    lastNumO = (num !== null) ? String(num) : "—";
    document.getElementById("oLastNum").textContent = lastNumO;
  }

  moving = false;
  currentPath = [];
  xturn = !xturn;
  stepsRemaining = nextSteps;

  const nextPiece = xturn ? "X" : "O";
  const nextPos = boardState.indexOf(nextPiece);
  
  // Check if player is surrounded/trapped
  const canMove = canCompletePath(nextPos, stepsRemaining);
    
  if (!canMove) {
    updateBoard();
    announce(`${nextPiece} has no valid moves! ${xturn ? "O" : "X"} wins!`);
    gameOver = true;
    return;
  }

  updateBoard();
}

function isValidStep(from, to) {
  const fromRow = Math.floor(from / SIZE), fromCol = from % SIZE;
  const toRow   = Math.floor(to   / SIZE), toCol   = to   % SIZE;
  if (Math.abs(fromRow - toRow) + Math.abs(fromCol - toCol) !== 1) return false;
  if (blocked.has(to))          return false;
  if (currentPath.includes(to)) return false;
  if (boardState[to] !== null)  return false;
  return true;
}

function getAdjacent(i) {
  const row = Math.floor(i / SIZE), col = i % SIZE;
  const adj = [];
  if (row > 0)        adj.push(i - SIZE);
  if (row < SIZE - 1) adj.push(i + SIZE);
  if (col > 0)        adj.push(i - 1);
  if (col < SIZE - 1) adj.push(i + 1);
  return adj;
}

function updateBoard() {
  const currentPos = moving ? currentPath[currentPath.length - 1] : null;

  document.querySelectorAll(".cell").forEach((cell, i) => {
    cell.className = "cell";
    cell.innerHTML = "";

    // 1. Show Pieces (Top Priority)
    if (boardState[i] === "X") {
      cell.innerHTML = `<span class="x">X</span>`;
    } else if (boardState[i] === "O") {
      cell.innerHTML = `<span class="o">O</span>`;
    } 
    // 2. Show Blocked Dots
    else if (blocked.has(i)) {
      cell.classList.add("blocked");
      cell.textContent = "·";
    } 
    // 3. Show Numbers
    else if (boardNumbers[i] !== null) {
      cell.textContent = boardNumbers[i];
    }

    // Highlighting
    if (moving) {
      if (i === currentPos) {
        cell.classList.add("selected");
      } else if (currentPath.includes(i) && i !== currentPos) {
        cell.classList.add("path");
      } else if (currentPos !== null && isValidStep(currentPos, i)) {
        cell.classList.add("valid");
      }
    }
  });

  document.getElementById("turnIndicator").innerHTML =
    `Turn: <span class="${xturn ? "x" : "o"}">${xturn ? "X" : "O"}</span>`;
  document.getElementById("stepsDisplay").textContent = stepsRemaining;
}

function announce(msg) {
  const box = document.getElementById("announcement");
  box.textContent = msg;
  box.style.display = "block";
}
</script>

</body>
</html>
